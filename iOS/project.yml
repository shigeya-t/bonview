# XcodeGen spec for the iOS / iPadOS app. Generate the project with `scripts/build_ios.sh`
# (or `xcodegen generate --spec iOS/project.yml`); BonView-iOS.xcodeproj is not checked in.
name: BonView-iOS
options:
  bundleIdPrefix: io.github.shigeya-t
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5"
    MARKETING_VERSION: "0.1.3"
    CURRENT_PROJECT_VERSION: "5"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    # The FFmpeg XCFrameworks are arm64 only (devices and Apple silicon Simulators).
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
packages:
  BonView:
    path: ..
targets:
  BonViewiOS:
    type: application
    platform: iOS
    sources:
      - path: BonView
      # App model, programme guide and caption views shared with the macOS app.
      - path: ../Shared
      - path: ../Resources/Licenses
        type: folder
        buildPhase: resources
      - path: ../LICENSE
        buildPhase: resources
      # FFmpeg licence texts from scripts/build_ffmpeg_ios.sh.
      - path: ../build/ffmpeg-ios/FFmpeg
        type: folder
        buildPhase: resources
    dependencies:
      - package: BonView
        product: BonDriver
      - package: BonView
        product: TSCore
      - package: BonView
        product: MediaCore
      - package: BonView
        product: ChannelScan
      - package: BonView
        product: SettingsSync
    settings:
      base:
        PRODUCT_NAME: BonView
        PRODUCT_BUNDLE_IDENTIFIER: io.github.shigeya-t.BonView
        INFOPLIST_FILE: BonView/Info.plist
        CODE_SIGN_ENTITLEMENTS: BonView/BonView.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
